name: Wheels

# Python package: platform wheels that carry the C engine (libopngx + the
# opngx-engine CLI) plus the sdist. Every wheel is install-tested on the
# oldest and newest supported CPython before anything can be published.
# Called by CI (every push) and by Release (tags); runnable by hand too.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test manylinux2014 wheel and sdist (in the manylinux container)
        # JS actions can't run inside the CentOS 7 image, so plain docker run
        run: |
          docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux2014_x86_64 \
            bash scripts/ci/build-linux-wheel.sh
      - name: Test the wheel on the runner's own distro (Ubuntu, Qt extra)
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet "$(ls wheelhouse/*.whl)[qt]" pytest
          cd python/tests && QT_QPA_PLATFORM=offscreen /tmp/v/bin/python -m pytest -q -p no:cacheprovider \
            test_analysis.py test_opngx.py
          /tmp/v/bin/opngx --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*

  windows-wheel:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.13
            3.12
      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja make
      - name: Build libdeflate (static) + engine
        run: |
          git clone --depth 1 --branch v1.22 https://github.com/ebiggers/libdeflate.git /tmp/ld
          cmake -S /tmp/ld -B /tmp/ldb -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF -DLIBDEFLATE_BUILD_TESTS=OFF
          cmake --build /tmp/ldb -j
          mkdir -p vendor/win
          cp /tmp/ld/libdeflate.h vendor/win/
          find /tmp/ldb -name 'libdeflate.a' -exec cp {} vendor/win/ \;
          cmake -S . -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-w64-mingw32.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_LIB=$PWD/vendor/win/libdeflate.a \
            -DLIBDEFLATE_INC=$PWD/vendor/win \
            -DOPNGX_WITH_ZLIB=OFF -G Ninja
          cmake --build build-win -j
          ./build-win/opngx-engine.exe --version
          # a wheel can't ship libgcc/libwinpthread DLLs next to the ctypes lib
          for f in build-win/libopngx.dll build-win/opngx-engine.exe; do
            objdump -p "$f" | grep "DLL Name" | tee /tmp/deps
            if grep -Ei "libgcc|libwinpthread|libstdc|libdeflate|zlib" /tmp/deps; then
              echo "::error::$f needs a non-system DLL"; exit 1
            fi
          done
      - name: Build win_amd64 wheel
        shell: pwsh
        run: |
          python -m pip install --quiet build wheel "setuptools>=77"
          python scripts/build_wheel.py --lib build-win/libopngx.dll `
            --engine build-win/opngx-engine.exe --plat-tag win_amd64 --outdir wheelhouse
          Get-ChildItem wheelhouse
      - name: Install-test on CPython 3.9 and 3.13 (venv NOT activated)
        shell: pwsh
        run: |
          $whl = (Get-ChildItem wheelhouse\*.whl).FullName
          foreach ($v in "3.9", "3.13") {
            $venv = "$env:RUNNER_TEMP\venv$v"
            py -$v -m venv $venv
            & "$venv\Scripts\python.exe" -m pip install --quiet $whl pytest
            if ($LASTEXITCODE) { exit 1 }
            Push-Location $env:RUNNER_TEMP
            & "$venv\Scripts\python.exe" -c "import opngx, opngx.analysis.native as n; from opngx import _engine; p = _engine.library_path(); print(opngx.__version__, p, n.available()); assert '_native' in str(p) and n.available()"
            if ($LASTEXITCODE) { exit 1 }
            Pop-Location
            Push-Location python\tests
            & "$venv\Scripts\python.exe" -m pytest -q -p no:cacheprovider test_analysis.py test_opngx.py
            if ($LASTEXITCODE) { exit 1 }
            Pop-Location
            & "$venv\Scripts\opngx.exe" --help | Select-Object -First 3
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
