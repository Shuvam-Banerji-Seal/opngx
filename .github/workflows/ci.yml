name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
        backend: [with-libdeflate, zlib-only]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
        exclude:
          - compiler: clang
            backend: zlib-only
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdeflate-dev zlib1g-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Configure & build (${{ matrix.backend }})
        run: |
          if [ "${{ matrix.backend }}" = "zlib-only" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPNGX_WITH_LIBDEFLATE=OFF
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build -j"$(nproc)"

      - name: Engine test suite (uv-managed env)
        run: |
          cd python
          uv sync --all-extras
          uv run python ../tests/gen_fixture.py /tmp/opngx-ci-fixture
          cd ..
          PATH="$PWD/python/.venv/bin:$PATH" bash tests/test_engine.sh

      - name: Static Linux executable
        run: |
          git clone --depth 1 --branch v1.22 https://github.com/ebiggers/libdeflate.git /tmp/ld
          cmake -S /tmp/ld -B /tmp/ldb -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF -DLIBDEFLATE_BUILD_TESTS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/ldb -j
          mkdir -p vendor/linux dist
          find /tmp/ldb -name 'libdeflate.a' -exec cp {} vendor/linux/ \;
          cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_LIB=$PWD/vendor/linux/libdeflate.a \
            -DLIBDEFLATE_INC=$PWD/vendor/win \
            -DOPNGX_WITH_ZLIB=OFF -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build-rel -j
          strip build-rel/opngx-engine
          ./build-rel/opngx-engine --version
          cp build-rel/opngx-engine dist/opngx-linux
          tar czf dist/opngx-linux-x86_64.tar.gz -C dist opngx-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/opngx-linux-x86_64.tar.gz

      - name: Python package tests
        run: |
          cd python && uv sync --all-extras && uv run pytest ../python/tests -q

  abi-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ctypes struct mirrors opngx_params (field-name diff guard)
        run: |
          sudo apt-get update && sudo apt-get install -y python3
          python3 - << 'EOF'
          import re
          h = open('src/opngx.h').read()
          m = re.search(r'typedef struct \{(.*?)\} opngx_params;', h, re.S)
          c_fields = set(re.findall(r'^\s*(?:const char \*|int64_t\s+|uint32_t\s+|double\s+|opngx_\w+\s+|int\s+)(\w+);', m.group(1), re.M))
          p = open('python/src/opngx/_engine.py').read()
          m2 = re.search(r'_fields_ = \[(.*?)\]', p, re.S)
          py_fields = set(re.findall(r'\("(\w+)",', m2.group(1)))
          missing_py = {f for f in c_fields if f not in py_fields and f != 'footage_path'}
          # footage_path is nullable char* kept in both; report real drift only
          assert not (c_fields - py_fields), f"struct drift! C-only fields: {c_fields - py_fields}"
          print('ABI mirror OK:', sorted(c_fields))
          EOF

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make

      - name: Build libdeflate (static, MinGW)
        run: |
          git clone --depth 1 --branch v1.22 https://github.com/ebiggers/libdeflate.git /tmp/ld
          cmake -S /tmp/ld -B /tmp/ldb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF -DLIBDEFLATE_BUILD_TESTS=OFF
          cmake --build /tmp/ldb -j
          mkdir -p vendor/win
          cp /tmp/ld/libdeflate.h vendor/win/
          find /tmp/ldb -name 'libdeflate.a' -exec cp {} vendor/win/ \;

      - name: Configure & build engine
        run: |
          cmake -S . -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-w64-mingw32.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBDEFLATE_LIB=$PWD/vendor/win/libdeflate.a \
            -DLIBDEFLATE_INC=$PWD/vendor/win \
            -DOPNGX_WITH_ZLIB=OFF -G Ninja
          cmake --build build-win -j
          ./build-win/opngx-engine.exe --version

      - name: Build opngx-studio.exe (PyInstaller, embeds libopngx.dll)
        shell: pwsh
        run: |
          python -m pip install --quiet pyinstaller numpy pillow PySide6
          pip install --quiet "./python[qt]"
          Copy-Item build-win/libopngx.dll .
          pyinstaller --noconfirm opngx.spec
          Get-ChildItem dist

      - name: Build docs.zip + one-click setup.exe
        shell: pwsh
        run: |
          Compress-Archive -Path README.md, docs/FORMAT.md, docs/BENCHMARKS.md `
            -DestinationPath installer/docs.zip -Force
          Copy-Item build-win/opngx-engine.exe installer/
          Copy-Item dist/opngx-studio.exe installer/
          windres installer/app.rc -O coff -o installer/apprc.o
          gcc -O2 -mwindows installer/installer.c installer/apprc.o `
            -o dist/opngx-setup.exe -lole32 -luuid -lshell32 -ladvapi32 -static
          Remove-Item installer/opngx-engine.exe, installer/opngx-studio.exe, `
            installer/docs.zip, installer/apprc.o

      - name: Selftest render pipeline (uses available ffmpeg)
        shell: pwsh
        run: |
          $env:OPNGX_TEST_FFMPEG = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $env:OPNGX_TEST_FFMPEG) { throw "no ffmpeg on runner" }
          Write-Host "using ffmpeg: $env:OPNGX_TEST_FFMPEG"
          python -c "
          import struct, tempfile, os
          from pathlib import Path
          import numpy as np
          from opngx.video import render_video
          w,h,n = 64,48,10
          d = Path(tempfile.mkdtemp(prefix='opngx_selftest_'))
          rng = np.random.default_rng(7)
          binp = d/'st.bin'
          with open(binp,'wb') as f:
              for i in range(n):
                  f.write(struct.pack('<Q',1_000_000+i*2000))
                  f.write(rng.integers(0,256,size=(h*w),dtype=np.uint8).tobytes())
          out = d/'selftest.mp4'
          st = render_video(str(binp),str(out),mode='raw',width=w,height=h,start=0,count=n,fps=10,crf=30)
          ok = st['frames_written']==n and out.exists() and out.stat().st_size>1024
          print('SELFTEST', 'PASS' if ok else 'FAIL', st['frames_written'], out.stat().st_size)
          if not ok: raise SystemExit(1)
          "

      - name: Smoke-test installed layout (silent install into sandbox)
        shell: cmd
        run: |
          dist\opngx-setup.exe /S
          if not exist "%LOCALAPPDATA%\opngx\opngx-engine.exe" exit 1
          if not exist "%LOCALAPPDATA%\opngx\opngx-studio.exe" exit 1
          "%LOCALAPPDATA%\opngx\opngx-engine.exe" --version

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/opngx-setup.exe
            dist/opngx-studio.exe
            build-win/opngx-engine.exe
