[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opngx"
version = "1.5.0"
description = "Ultra-fast Optronis TimeViewer .bin footage extractor - multi-core PNG conversion with metadata & timestamp export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "opngx contributors" }]
keywords = ["optronis", "high-speed-camera", "png", "extraction", "footage"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Multimedia :: Video :: Conversion",
    "Environment :: X11 Applications",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
ui = ["pillow>=9.0"]
qt = ["PySide6>=6.5", "imageio-ffmpeg>=0.4"]
dev = ["pytest>=7.0", "pillow>=9.0"]

[project.scripts]
opngx = "opngx.cli:main"
opngx-ui = "opngx.ui:main"

[project.urls]
Homepage = "https://github.com/shuvam07/opngx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opngx = ["py.typed"]
